<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reward Sampah Pintar</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        body { 
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
            background-image: url('kokurikuler.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            padding-top: 50px;
            margin: 0;
            color: white;
        }
        .card { 
            background: rgba(30, 42, 68, 0.85); 
            width: 85%; 
            max-width: 400px; 
            margin: 20px auto; 
            padding: 25px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
        }
        #poin { 
            font-size: 100px; 
            font-weight: bold; 
            color: #4CAF50; 
            margin: 10px 0; 
        }
        .box-hadiah {
            background: rgba(30, 42, 68, 0.9); 
            padding: 15px; 
            border-radius: 15px; 
            width: 140px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        button {
            color: white; 
            border: none; 
            padding: 12px; 
            border-radius: 8px; 
            font-weight: bold; 
            width: 100%; 
            margin-top: 8px;
            transition: 0.3s;
            cursor: pointer;
        }
        button:disabled {
            background-color: #666 !important;
            cursor: not-allowed;
            opacity: 0.6;
        }
        .test-btn {
            background: #2196F3;
            color: white;
            border: none;
            padding: 10px 15px;
            margin: 5px;
            border-radius: 8px;
            font-weight: bold;
        }

        /* POP-UP */
        #successModal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: #1e2a44;
            padding: 30px 25px;
            border-radius: 20px;
            text-align: center;
            max-width: 340px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }
        .modal-content h2 { color: #4CAF50; margin: 0 0 10px 0; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Poin Kamu</h1>
        <div id="poin">0</div>
        <p style="font-style: italic; color: #a5d6a7;">"Sampahmu jadi hadiahmu!"</p>
        
        <div style="margin-top: 15px;">
            <button class="test-btn" onclick="tambahPoin(10)">+10 Poin</button>
            <button class="test-btn" onclick="tambahPoin(50)">+50 Poin</button>
            <button class="test-btn" onclick="tambahPoin(100)">+100 Poin</button>
        </div>
    </div>

    <h2 style="margin-top: 30px; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.8);">Tukar Hadiah Kamu</h2>
    
    <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; padding: 20px;">
      <div class="box-hadiah">
        <h3>Pulpen</h3>
        <p>10 Poin</p>
        <button id="btn-10" onclick="tukarPoin('Pulpen', 10)">Tukar</button>
      </div>
      <div class="box-hadiah">
        <h3>Tipe-x</h3>
        <p>50 Poin</p>
        <button id="btn-50" onclick="tukarPoin('Tipe-x', 50)">Tukar</button>
      </div>
      <div class="box-hadiah">
        <h3>Buku</h3>
        <p>75 Poin</p>
        <button id="btn-75" onclick="tukarPoin('Buku', 75)">Tukar</button>
      </div>
    </div>

    <!-- POP UP -->
    <div id="successModal">
        <div class="modal-content">
            <h2>✅ Berhasil Menukar!</h2>
            <p id="namaHadiah" style="font-size:18px; margin:15px 0;"></p>
            <p>Silahkan hubungi nomor di bawah ini untuk pengambilan hadiah:</p>
            <a href="https://wa.me/62881022985998" target="_blank" 
               style="background:#25D366; color:white; padding:12px 20px; border-radius:50px; text-decoration:none; display:inline-block; margin:15px 0;">
                📲 0881022985998 (WA)
            </a>
            <br>
            <button onclick="tutupModal()" style="background:#666; padding:8px 25px; border:none; border-radius:8px;">Tutup</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD9mZorhqDFYLzgTStpOX6tz7LaYb2Qj80",
            authDomain: "kokulikuler-sare-sys.firebaseapp.com",
            databaseURL: "https://smarttrash-default-rtdb.firebaseio.com",
            projectId: "kokulikuler-sare-sys",
            storageBucket: "kokulikuler-sare-sys.appspot.com",
            messagingSenderId: "27587067022",
            appId: "27587067022"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        let poinGlobal = 0;

        function aturTombol(poin) {
            document.getElementById("btn-10").disabled = poin < 10;
            document.getElementById("btn-50").disabled = poin < 50;
            document.getElementById("btn-75").disabled = poin < 75;
        }

        database.ref('/trash_points').on('value', (snapshot) => {
            poinGlobal = Number(snapshot.val()) || 0;
            document.getElementById('poin').innerText = poinGlobal;
            aturTombol(poinGlobal);
        });

        function tukarPoin(namaBarang, harga) {
            if (poinGlobal < harga) {
                alert("Poin tidak cukup!");
                return;
            }
            if (!confirm(`Yakin tukar ${namaBarang}?`)) return;

            database.ref('/trash_points').transaction((current) => {
                let p = Number(current) || 0;
                if (p >= harga) return p - harga;
            }, (error, committed) => {
                if (committed) {
                    document.getElementById('namaHadiah').innerText = namaBarang;
                    document.getElementById('successModal').style.display = "flex";
                }
            });
        }

        function tutupModal() {
            document.getElementById('successModal').style.display = "none";
        }

        function tambahPoin(jumlah) {
            database.ref('/trash_points').transaction((current) => (Number(current) || 0) + jumlah);
        }
    </script>
</body>
</html>
